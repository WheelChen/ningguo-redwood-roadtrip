const byId = id => document.getElementById(id);
function node(tag, content, cls) {
  const el = document.createElement(tag);
  if (content != null) el.textContent = content;
  if (cls) el.className = cls;
  return el;
}
function link(label, value) {
  try {
    const url = new URL(value);
    if (url.protocol !== "https:" || url.username || url.password) return null;
    const el = node("a",label); el.href=url.href; return el;
  } catch { return null; }
}
function blocks(parent,title,rows) {
  if (!rows.length) return;
  parent.append(node("h3",title));
  const div=node("div",null,"cards");
  for (const [label,value] of rows) {
    const card=node("div",null,"card");
    card.append(node("strong",label),node("p",value));
    div.append(card);
  }
  parent.append(div);
}
function dayCard(day) {
  const article=node("article",null,"card day");
  article.append(node("small",day.label+" · "+day.date),node("h3",day.title),node("p",day.stats,"note"));
  const timeline=node("ol",null,"timeline");
  for (const stop of day.stops) {
    const item=node("li");
    item.append(node("span",stop.time+" · "+stop.kind,"badge"),node("p",stop.name),node("p",stop.note,"note"));
    const map=link("打开导航",stop.map); if(map) item.append(map);
    timeline.append(item);
  }
  article.append(timeline);
  if (day.alternative) article.append(node("p","备选："+day.alternative));
  const alt=link("高德 · 打开备选路线",day.alternativeMap); if(alt) article.append(alt);
  return article;
}
function overview(parent) {
  parent.append(node("p",trip.summary));
  blocks(parent,"大交通",trip.transport);
  blocks(parent,"住宿",trip.lodging);
}
function setMap(index) {
  const m=trip.maps[index], frame=byId("route-map");
  if(frame.src!==m.url) frame.src=m.url;
  frame.title="高德驾车地图 · "+m.label;
  byId("map-context").textContent=m.subtitle;
  byId("map-open").href=m.url;
  byId("map-nav").href=m.nav;
  Array.from(byId("map-tabs").children).forEach((b,i)=>b.setAttribute("aria-pressed",String(i===index)));
}
trip.maps.forEach((m,i)=>{
  const b=node("button",m.label);
  b.type="button";b.setAttribute("aria-controls","route-map");
  b.addEventListener("click",()=>setMap(i));byId("map-tabs").append(b);
});
setMap(0);
function draw(index) {
  if(index>=0) setMap(index===0?0:1);
  const current=byId("current"), route=byId("route");
  current.replaceChildren(); route.replaceChildren();
  if(index < 0) {
    current.append(node("h2","总览")); overview(current);
    blocks(current,"每日安排",trip.days.map(d=>[d.label+" · "+d.title,d.date+"｜"+d.stats]));
  } else {
    current.append(node("h2",trip.days[index].label+" 日程"),dayCard(trip.days[index]));
  }
  if(index<0) route.append(node("p","先选去程或返程，再在高德改为实际出发地址；现场分流优先。","note"));
  const visible=index<0 ? trip.days : [trip.days[index]];
  for(const day of visible) {
    route.append(node("h3",day.label+" · "+day.title));
    const list=node("ol",null,"route");
    for(const stop of day.stops) {
      const entry=node("li",stop.kind+" · "+stop.name);
      const map=link("导航",stop.map); if(map) entry.append(" · ",map);
      list.append(entry);
    }
    route.append(list);
  }
  Array.from(byId("switcher").children).forEach((b,i)=>b.setAttribute("aria-pressed",String(i===index+1)));
}
document.title=trip.title;
byId("title").textContent=trip.title;
byId("subtitle").textContent=trip.subtitle;
for(const [label,url] of trip.quick){const a=link(label,url); if(a) byId("quick").append(a);}
for(const [label,value] of trip.metrics) {
  const card=node("div",null,"card");
  card.append(node("small",label),node("p",value));
  byId("metrics").append(card);
}
["总览",...trip.days.map(d=>d.label)].forEach((label,i)=>{
  const b=node("button",label); b.type="button"; b.setAttribute("aria-controls","current route");
  b.addEventListener("click",()=>draw(i-1)); byId("switcher").append(b);
});
const written=byId("written");
overview(written);
for(const day of trip.days) written.append(dayCard(day));
blocks(written,"费用",trip.costs);
const tasks=node("ul"); for(const t of trip.prep) tasks.append(node("li",t));
written.append(node("h3","出发检查"),tasks);
if(trip.sources.length) {
  const list=node("ul");
  for(const [label,url] of trip.sources) {
    const a=link(label,url); if(!a) continue;
    const item=node("li"); item.append(a); list.append(item);
  }
  if(list.children.length) written.append(node("h3","来源"),list);
}
draw(-1);
</script>
